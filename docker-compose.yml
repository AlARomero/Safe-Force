services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: app_service
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://172.16.238.2:11434
    volumes:
      - ./logs:/app/logs
      - ./results:/app/results
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - app_network

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    ports:
      - "7869:11434"
    volumes:
      - ./volumen_app:/root/.ollama
    container_name: ollama_service
    healthcheck:
      test: [ "CMD-SHELL", "ollama list | grep -q 'llama3:8b'" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      app_network:
        ipv4_address: 172.16.238.2

networks:
  app_network:
    external: false
    ipam:
      driver: default
      config:
        - subnet: "172.16.238.0/24"