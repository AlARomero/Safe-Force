services:
  app:
    build: .
    container_name: app_service
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://172.16.238.2:11434
    depends_on:
      - ollama
    networks:
      - app_network

  ollama:
    image: ollama/ollama
    ports:
      - "7869:11434"
    volumes:
      - ./volumen_app:/root/.ollama
    container_name: ollama_service
    networks:
      app_network:
        ipv4_address: 172.16.238.2

networks:
  app_network:
    external: false
    ipam:
      driver: default
      config:
        - subnet: "172.16.238.0/24"