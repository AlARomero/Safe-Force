services:
  app:
    build: .
    container_name: app_service
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_HOST=http://172.16.238.2:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - app_network

  ollama:
    image: ollama/ollama
    ports:
      - "7869:11434"
    volumes:
      - ./volumen_app:/root/.ollama
      - ./ollama_healthcheck.sh:/app/ollama_healthcheck.sh
    container_name: ollama_service
    networks:
      app_network:
        ipv4_address: 172.16.238.2
    healthcheck:
      test: ["CMD-SHELL", "/app/ollama_healthcheck.sh"]
      interval: 10s
      timeout: 3s
      retries: 120

networks:
  app_network:
    external: false
    ipam:
      driver: default
      config:
        - subnet: "172.16.238.0/24"